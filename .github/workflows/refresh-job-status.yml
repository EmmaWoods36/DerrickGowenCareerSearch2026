name: Refresh Derrick job status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/check_job_status.py
      - name: Commit tracker refresh
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "Derrick Job Tracker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          git commit -m "Refresh Derrick job status"
          git push
