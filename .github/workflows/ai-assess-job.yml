name: AI assess Derrick job

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  models: read

jobs:
  assess:
    if: startsWith(github.event.issue.body, 'AI_JOB_ASSESSMENT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Assess job against Derrick profile
        run: python scripts/process_ai_job_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit assessed role
        run: |
          git config user.name "Derrick Job Tracker AI"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add jobs.json
            git commit -m "AI assess job from issue #${{ github.event.issue.number }}"
            git push
          fi
      - name: Comment assessment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The AI assessment workflow completed.';
            if (fs.existsSync('/tmp/issue_comment.md')) body = fs.readFileSync('/tmp/issue_comment.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
